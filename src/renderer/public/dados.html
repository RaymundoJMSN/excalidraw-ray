<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dados</title>
<style>
  @font-face { font-family: Virgil; src: url(fonts/Virgil/Virgil-Regular.woff2) format("woff2") }
  /* paleta do Excalidraw: claro = fundo branco / ilha #fff; escuro = #121212 / ilha #232329 */
  :root { --bg: #ffffff; --ilha: #f8f9fa; --borda: #d6d6d6; --txt: #1b1b1f; --fraco: #8a8a94; --cor: #6965db; --cor-txt: #fff; --max: #2f9e44; --min: #e03131; color-scheme: light }
  :root.escuro { --bg: #121212; --ilha: #232329; --borda: #3d3d48; --txt: #e3e3e8; --fraco: #7d7c88; --cor: #a8a5ff; --cor-txt: #121212; --max: #69db7c; --min: #ff8787; color-scheme: dark }
  * { box-sizing: border-box }
  html, body { height: 100% }
  body { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px;
         background: var(--bg); color: var(--txt); font: 14px Virgil, "Segoe UI", system-ui, sans-serif; user-select: none }
  form { display: flex; gap: 6px }
  input { flex: 1; min-width: 0; font: 20px Virgil, system-ui, sans-serif; padding: 6px 10px; border-radius: 8px;
          background: var(--ilha); color: var(--txt); border: 1px solid var(--borda); user-select: text }
  input:focus { outline: none; border-color: var(--cor); box-shadow: 0 0 0 1px var(--cor) }
  button { font: inherit; border: 1px solid var(--borda); border-radius: 8px; background: var(--ilha); color: var(--txt); cursor: pointer; padding: 4px 8px }
  button:hover { border-color: var(--cor) }
  .rolar { background: var(--cor); color: var(--cor-txt); border-color: var(--cor); padding: 4px 14px }
  .botoes { display: flex; gap: 4px; flex-wrap: wrap }
  .botoes button { flex: 1; padding: 3px 0; font-size: 13px }
  #total { font-size: 56px; line-height: 1; text-align: center; color: var(--cor); margin: 4px 0 }
  #total.erro { font-size: 16px; color: var(--min) }
  #detalhe { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; min-height: 22px }
  .dado { display: inline-flex; align-items: center; gap: 3px; color: var(--fraco) }
  .face { display: inline-block; min-width: 22px; padding: 1px 4px; text-align: center; border: 1px solid var(--borda); border-radius: 5px; color: var(--txt); background: var(--ilha) }
  .face.fora { opacity: .4; text-decoration: line-through }
  .face.max { border-color: var(--max); color: var(--max) }
  .face.min { border-color: var(--min); color: var(--min) }
  #hist { margin-top: auto; font-size: 12px; color: var(--fraco); overflow: hidden }
  #hist div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer }
  #hist div:hover { color: var(--txt) }
  #hist b { color: var(--txt) }
</style>
<form id="form">
  <input id="f" value="1d20" autofocus spellcheck="false" autocomplete="off" placeholder="2d20kh + 10*1d8">
  <button class="rolar" type="submit">Rolar</button>
</form>
<div class="botoes" id="botoes"></div>
<div id="total">—</div>
<div id="detalhe"></div>
<div id="hist"></div>
<script src="dados.js"></script>
<script>
  // tema: ?theme=light|dark (o Excalidraw põe na URL ao inserir), senão o do sistema
  const tema = new URLSearchParams(location.search).get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
  document.documentElement.classList.toggle("escuro", tema === "dark")

  const f = document.getElementById("f"), total = document.getElementById("total"),
        detalhe = document.getElementById("detalhe"), hist = document.getElementById("hist"), hs = []
  function rolar(expr) {
    let r
    try { r = rolarDados(expr) } catch (e) { total.textContent = e.message; total.className = "erro"; detalhe.innerHTML = ""; return }
    total.className = ""; total.textContent = Number.isInteger(r.total) ? r.total : r.total.toFixed(2)
    detalhe.innerHTML = r.partes.map(p => `<span class="dado">${p.dado}${p.rolagens.map(x =>
      `<span class="face${x.usado ? "" : " fora"}${x.v === p.lados && p.lados > 1 ? " max" : x.v === 1 && p.lados > 1 ? " min" : ""}">${x.v}</span>`).join("")}</span>`).join("")
    hs.unshift({ expr, total: total.textContent }); hs.length = Math.min(hs.length, 6)
    hist.innerHTML = hs.map(h => `<div data-e="${h.expr}">${h.expr} → <b>${h.total}</b></div>`).join("")
  }
  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); rolar(f.value); f.focus(); f.select() })
  hist.addEventListener("click", e => { const d = e.target.closest("[data-e]"); if (d) { f.value = d.dataset.e; rolar(f.value) } })
  for (const d of ["d4", "d6", "d8", "d10", "d12", "d20", "d100"]) {
    const b = document.createElement("button"); b.textContent = d; b.type = "button"
    b.onclick = () => { f.value = "1" + d; rolar(f.value) }
    document.getElementById("botoes").append(b)
  }
  // ponytail: histórico só em memória; localStorage se um dia precisar sobreviver ao reload
</script>
</html>
