<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dados</title>
<style>
  :root { color-scheme: dark }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 14px;
         background: #1b1b1f; color: #eee; font: 18px system-ui, sans-serif; text-align: center }
  input { font: inherit; font-size: 28px; width: 10em; padding: 6px 10px; text-align: center;
          background: #26262c; color: #fff; border: 1px solid #444; border-radius: 8px }
  input:focus { outline: 2px solid #ffc200 }
  .botoes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap }
  button { font: inherit; padding: 6px 12px; background: #2d2d35; color: #ddd; border: 0; border-radius: 6px; cursor: pointer }
  button:hover { background: #3a3a44 }
  #total { font-size: 72px; font-weight: 700; color: #ffc200; line-height: 1 }
  #detalhe { color: #999; min-height: 1.4em }
  #hist { color: #777; font-size: 14px; max-width: 24em; margin: 0 auto }
  #hist div { padding: 2px 0 }
  .max { color: #6f6 } .min { color: #f66 }
</style>
<input id="f" value="1d20" autofocus spellcheck="false" placeholder="2d6+3">
<div class="botoes"></div>
<div id="total">—</div>
<div id="detalhe"></div>
<div id="hist"></div>
<script>
  const f = document.getElementById("f"), total = document.getElementById("total"),
        detalhe = document.getElementById("detalhe"), hist = document.getElementById("hist");
  const hs = [];
  function rolar(formula) {
    formula = formula.replace(/\s+/g, "").toLowerCase();
    if (!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(formula)) { total.textContent = "?"; detalhe.textContent = "ex.: 2d6+3, d20, 4d6-1"; return; }
    let soma = 0; const partes = [];
    for (const m of formula.matchAll(/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g)) {
      const sinal = (m[1] || m[4]) === "-" ? -1 : 1;
      if (m[3]) {
        const n = +(m[2] || 1), lados = +m[3], rs = [];
        for (let i = 0; i < n; i++) rs.push(1 + Math.floor(Math.random() * lados));
        soma += sinal * rs.reduce((a, b) => a + b, 0);
        partes.push(`${n}d${lados} [${rs.map(r => r === lados ? `<span class=max>${r}</span>` : r === 1 && lados > 1 ? `<span class=min>${r}</span>` : r).join(" ")}]`);
      } else { soma += sinal * +m[5]; partes.push((sinal < 0 ? "−" : "+") + m[5]); }
    }
    total.textContent = soma; detalhe.innerHTML = partes.join(" ");
    hs.unshift(`${formula} → <b>${soma}</b>`); hs.length = Math.min(hs.length, 10);
    hist.innerHTML = hs.map(h => `<div>${h}</div>`).join("");
  }
  f.addEventListener("keydown", e => { if (e.key === "Enter") rolar(f.value); });
  for (const d of ["d4", "d6", "d8", "d10", "d12", "d20", "d100"]) {
    const b = document.createElement("button"); b.textContent = d;
    b.onclick = () => { f.value = "1" + d; rolar(f.value); f.focus(); };
    document.querySelector(".botoes").append(b);
  }
  // ponytail: sem salvar histórico; se quiser, localStorage
</script>
</html>
